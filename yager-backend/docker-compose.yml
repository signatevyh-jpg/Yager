services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: poyet
      POSTGRES_PASSWORD: poyet
      POSTGRES_DB: poyet
    volumes:
      - poyet_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poyet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://poyet:poyet@db:5432/poyet
      JWT_SECRET: change-me-in-production
      JWT_EXPIRE_MINUTES: "10080"
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"

volumes:
  poyet_db_data:

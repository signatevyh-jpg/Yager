<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Ягерь — мессенджер</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2AABEE">

<!-- iOS: делает возможной установку "На экран Домой" как полноэкранное приложение -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ягерь">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Android/Chrome иконка -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="auth-screen"></div>

<div id="app-screen" hidden>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <div class="brand">
          <div id="current-user-avatar"></div>
          <div>
            <div id="current-user-name"></div>
            <div id="current-user-sub">в сети</div>
          </div>
        </div>
        <button class="icon-btn" id="new-chat-btn" title="Новый чат">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="logout-btn" title="Выйти">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
      <div id="search-wrap">
        <input type="text" id="search-input" placeholder="Поиск">
      </div>
      <div id="chat-list"></div>
    </div>
    <div id="main"></div>
  </div>
</div>

<div id="new-chat-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <h3>Новый чат</h3>
    <p class="modal-sub">Введите имя пользователя, с которым хотите начать переписку</p>
    <form id="new-chat-form">
      <input type="text" id="new-chat-username" placeholder="имя пользователя" autocomplete="off" required>
      <div id="new-chat-error" class="auth-error" hidden></div>
      <div class="modal-actions">
        <button type="button" id="new-chat-cancel" class="modal-btn secondary">Отмена</button>
        <button type="submit" class="modal-btn primary">Начать чат</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // Регистрация не удастся при открытии файла напрямую (file://) —
        // это нормально, service worker заработает после публикации на http(s).
      });
    });
  }

  (async () => {
    const user = await PoyetAPI.getCurrentUser();
    if (user) App.start(user);
    else Auth.show();
  })();
</script>
</body>
</html>

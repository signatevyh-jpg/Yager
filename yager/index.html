<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Ягерь — мессенджер</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2AABEE">

<!-- iOS: делает возможной установку "На экран Домой" как полноэкранное приложение -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ягерь">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Android/Chrome иконка -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<div id="auth-screen"></div>

<div id="app-screen" style="display: none;" hidden>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <div class="brand" id="current-user-profile-trigger" style="cursor: pointer;" title="Открыть мой профиль">
          <div id="current-user-avatar"></div>
          <div>
            <div id="current-user-name"></div>
            <div id="current-user-sub">в сети</div>
          </div>
        </div>
        <button class="icon-btn" id="new-group-btn" title="Создать группу">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </button>
        <button class="icon-btn" id="new-chat-btn" title="Новый личный чат">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="logout-btn" title="Выйти">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
      <div id="search-wrap">
        <input type="text" id="search-input" placeholder="Поиск">
      </div>
      <div id="chat-list"></div>
    </div>
    <div id="main"></div>
  </div>
</div>

<!-- New Direct Chat Modal -->
<div id="new-chat-modal" class="modal-overlay" style="display: none;" hidden>
  <div class="modal-card">
    <h3>Новый чат</h3>
    <p class="modal-sub">Поиск по имени или имени пользователя (username):</p>
    <form id="new-chat-form">
      <input type="text" id="new-chat-username" placeholder="Поиск по имени или @username" autocomplete="off" required>
      <div id="new-chat-suggestions" class="suggestions-list"></div>
      <div id="new-chat-error" class="auth-error" hidden></div>
      <div class="modal-actions">
        <button type="button" id="new-chat-cancel" class="modal-btn secondary">Отмена</button>
        <button type="submit" class="modal-btn primary">Начать чат</button>
      </div>
    </form>
  </div>
</div>

<!-- New Group Chat Modal -->
<div id="new-group-modal" class="modal-overlay" style="display: none;" hidden>
  <div class="modal-card" style="max-width: 440px;">
    <h3>Создать группу</h3>
    <p class="modal-sub">Укажите название, круглую аватарку и участников:</p>
    
    <div class="group-create-avatar-row">
      <div class="avatar-upload-circle" id="group-avatar-trigger" title="Нажмите, чтобы выбрать аватарку группы">
        <div id="group-avatar-preview" class="avatar-upload-placeholder">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>Фото</span>
        </div>
      </div>
      <div style="flex: 1;">
        <input type="text" id="group-name-input" placeholder="Название группы" class="modal-text-input" required maxlength="60">
      </div>
    </div>

    <div style="margin-top: 14px;">
      <label class="modal-field-label">Добавить участников (поиск по имени или @username):</label>
      <input type="text" id="group-member-search" placeholder="Введите имя или @username" class="modal-text-input" autocomplete="off">
      <div id="group-member-suggestions" class="suggestions-list"></div>
      
      <div id="group-selected-members" class="group-selected-chips"></div>
    </div>

    <div id="group-create-error" class="auth-error" hidden></div>
    <div class="modal-actions" style="margin-top: 18px;">
      <button type="button" id="new-group-cancel" class="modal-btn secondary">Отмена</button>
      <button type="button" id="new-group-submit" class="modal-btn primary">Создать группу</button>
    </div>
  </div>
</div>

<!-- Profile Modal (View and Edit) -->
<div id="profile-modal" class="modal-overlay" style="display: none;" hidden>
  <div class="modal-card" style="max-width: 420px; width: 100%;">
    <div class="profile-modal-header">
      <h3 id="profile-modal-title">Профиль</h3>
      <button type="button" class="icon-btn" id="profile-modal-close" title="Закрыть">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    
    <div id="profile-modal-body"></div>
  </div>
</div>

<!-- Avatar Circular Cropper Modal -->
<div id="avatar-crop-modal" class="modal-overlay" style="display: none;" hidden>
  <div class="modal-card crop-modal-card">
    <h3>Кадрирование аватарки</h3>
    <p class="modal-sub">Перемещайте и масштабируйте фото в круге:</p>

    <div class="crop-canvas-container" id="crop-canvas-container">
      <canvas id="crop-canvas" width="280" height="280"></canvas>
      <div class="crop-circle-mask"></div>
    </div>

    <div class="crop-zoom-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      <input type="range" id="crop-zoom" min="1" max="3.5" step="0.05" value="1">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </div>

    <div class="modal-actions" style="margin-top: 18px;">
      <button type="button" id="crop-cancel-btn" class="modal-btn secondary">Отмена</button>
      <button type="button" id="crop-save-btn" class="modal-btn primary">Сохранить</button>
    </div>
  </div>
</div>

<!-- Hidden File Inputs -->
<input type="file" id="global-avatar-file-input" accept="image/*" style="display: none;" hidden>

<script src="js/config.js?v=3"></script>
<script src="js/mock-data.js?v=3"></script>
<script src="js/api.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/app.js?v=3"></script>
<script>
  // Immediate modal cancel handler available even before login
  document.getElementById('new-chat-cancel')?.addEventListener('click', () => {
    const modal = document.getElementById('new-chat-modal');
    if (modal) {
      modal.hidden = true;
      modal.style.display = 'none';
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      for (const reg of regs) {
        reg.unregister();
      }
    });
  }

  (async () => {
    try {
      const user = await PoyetAPI.getCurrentUser();
      if (user) {
        document.getElementById('app-screen').style.display = '';
        App.start(user);
      } else {
        Auth.show();
      }
    } catch {
      Auth.show();
    }
  })();
</script>
</body>
</html>
